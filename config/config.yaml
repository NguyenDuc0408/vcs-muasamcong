# ---------------------------------------------------------------------------
# Từ khóa nhận diện gói thầu thuộc lĩnh vực ATTT (An toàn thông tin).
# So khớp với TÊN GÓI THẦU: không phân biệt hoa/thường, khớp nguyên cụm từ.
# Tự thêm / bớt từ khóa tại đây, không cần sửa code.
# ---------------------------------------------------------------------------
attt_keywords:
  # Khớp một trong các từ này -> nhãn "Có" (rõ ràng là ATTT)
  strong:
    # Cụm từ chung
    - an toàn thông tin
    - an toàn thông tin mạng
    - an toàn hệ thống thông tin
    - an toàn, an ninh thông tin
    - an ninh thông tin
    - an ninh mạng
    - an toàn mạng
    - an toàn an ninh
    - an ninh bảo mật
    - bảo mật
    - attt
    - antt
    - cấp độ an toàn
    - đánh giá an toàn
    - kiểm tra an toàn
    - đánh giá an ninh
    - giám sát an toàn
    - giám sát an ninh
    - nguy cơ mất an toàn
    - iso 27001
    - "27001"
    # Tường lửa / chống xâm nhập / chống tấn công
    - tường lửa
    - firewall
    - waf
    - ips/ids
    - ids/ips
    - chống xâm nhập
    - phòng chống xâm nhập
    - chống tấn công
    - tấn công mạng
    - ddos
    - anti-ddos
    - bảo vệ hệ thống
    # Mã độc / diệt virus
    - mã độc
    - chống mã độc
    - phòng chống mã độc
    - antivirus
    - anti-virus
    - diệt virus
    - diệt vi rút
    - diệt virut
    - phòng chống virus
    - phần mềm virus
    - kaspersky
    - endpoint security
    - edr
    - xdr
    # Giám sát / ứng cứu / kiểm thử
    - siem
    - soc
    - ứng cứu sự cố
    - ứng phó sự cố
    - kiểm thử xâm nhập
    - pentest
    - penetration
    - lỗ hổng
    - lỗ hổng bảo mật
    - rà soát lỗ hổng
    - vá lỗi
    # Dữ liệu
    - chống thất thoát dữ liệu
    - chống rò rỉ dữ liệu
    - dlp
    - an toàn dữ liệu

  # Khớp từ này -> nhãn "Cần xem" (có thể là ATTT hoặc không, nên người dùng kiểm tra lại)
  weak:
    - mã hóa
    - mã hoá
    - mật mã
    - chữ ký số
    - chứng thư số
    - pki
    - hsm
    - vpn
    - xác thực đa yếu tố
    - xác thực hai yếu tố
    - mfa
    - 2fa
    - tài khoản đặc quyền
    - quản lý truy cập
    - sao lưu
    - bảo vệ dữ liệu
    - bảo vệ trang thông tin điện tử

  # Tên gói có cụm này thì LOẠI khỏi ATTT (cụm "an toàn" nhưng không phải thông tin)
  exclude:
    - an toàn lao động
    - an toàn vệ sinh lao động
    - an toàn điện
    - an toàn giao thông
    - an toàn thực phẩm
    - an toàn bức xạ
    - an toàn phòng nổ
    - an toàn hồ đập
    - dụng cụ an toàn
    - pccc
